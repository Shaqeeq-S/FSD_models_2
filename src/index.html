
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        form {
            width: 300px;
        }

        input, select, button {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        .delete-btn {
            background: red;
            width: auto;
            padding: 6px 12px;
        }

        #result {
            margin-top: 20px;
            width: 500px;
        }

        .student {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 10px;
        }

        #message {
            color: green;
        }
    </style>
</head>

<body>

    <h1>Student Registration</h1>

    <form id="studentForm">

        <label>Name:</label>
        <input type="text" id="name" required>

        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Age:</label>
        <input type="number" id="age" required>

        <label>Course:</label>
        <select id="course" required>
            <option value="">Select</option>
            <option value="AI & DS">AI & DS</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
        </select>

        <button type="submit">Submit</button>

    </form>

    <p id="message"></p>

    <h2>Students</h2>

    <button onclick="getStudents()">View Students</button>

    <div id="result"></div>


    <script>

        // =========================
        // ADD STUDENT
        // =========================
        document.getElementById("studentForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const student = {
                    name: document.getElementById("name").value,
                    email: document.getElementById("email").value,
                    age: document.getElementById("age").value,
                    course: document.getElementById("course").value
                };

                try {

                    const response = await fetch("/students", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(student)
                    });

                    const data = await response.json();

                    document.getElementById("message").innerText =
                        data.message || "Student added successfully";

                    document.getElementById("studentForm").reset();

                    // Refresh student list
                    getStudents();

                } catch (error) {

                    document.getElementById("message").innerText =
                        "Error adding student";

                    console.error(error);
                }
            });


        // =========================
        // GET STUDENTS
        // =========================
        async function getStudents() {

            try {

                const response = await fetch("/students");

                const students = await response.json();

                let output = "";

                students.forEach(function(student) {

                    output += `
                        <div class="student">

                            <b>Name:</b> ${student.name}<br>
                            <b>Email:</b> ${student.email}<br>
                            <b>Age:</b> ${student.age}<br>
                            <b>Course:</b> ${student.course}<br>

                            <button
                                class="delete-btn"
                                onclick="deleteStudent('${student._id}')">
                                Delete
                            </button>

                        </div>
                    `;
                });

                document.getElementById("result").innerHTML =
                    output || "No students found.";

            } catch (error) {

                document.getElementById("result").innerText =
                    "Error loading students";

                console.error(error);
            }
        }


        // =========================
        // DELETE STUDENT
        // =========================
        async function deleteStudent(id) {

            if (!confirm("Are you sure you want to delete this student?")) {
                return;
            }

            try {

                const response = await fetch(`/students/${id}`, {
                    method: "DELETE"
                });

                const data = await response.json();

                document.getElementById("message").innerText =
                    data.message || "Student deleted successfully";

                // Refresh list
                getStudents();

            } catch (error) {

                document.getElementById("message").innerText =
                    "Error deleting student";

                console.error(error);
            }
        }

    </script>

</body>
</html>
